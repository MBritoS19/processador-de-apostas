name: processador-de-apostas

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_WAGER_QUEUE_NAME: ${SQS_WAGER_QUEUE_NAME:-wager-transactions.fifo}
      SQS_WAGER_DLQ_NAME: ${SQS_WAGER_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_WAGER_EVENTS_QUEUE_NAME: ${SQS_WAGER_EVENTS_QUEUE_NAME:-wager-events.fifo}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-10}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      # Saudável só quando o init terminou E nenhum script falhou (completed=true não basta).
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/init/ready | python3 -c \"import json,sys; d=json.load(sys.stdin); sys.exit(0 if d['completed'] and d['scripts'] and all(s['state']=='SUCCESSFUL' for s in d['scripts']) else 1)\""]
      interval: 2s
      timeout: 3s
      retries: 60

  # Profile `multi` (3 réplicas da aplicação sobre o mesmo Postgres e LocalStack):
  #   docker compose --profile multi up -d --build --wait
  # Fora da suíte de testes; o `bun run test:multi` sobe processos locais, não estes containers.
  migrate:
    profiles: ["multi"]
    build: .
    command: ["bun", "src/infrastructure/persistence/migrate.ts", "up"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: ["multi"]
    build: .
    deploy:
      replicas: 3
    # Os três *_SHUTDOWN_TIMEOUT_MS (8s cada) rodam em sequência; o loadConfig recusa soma acima de
    # SHUTDOWN_BUDGET_MS (25s), que fica abaixo destes 30s: o SIGTERM termina antes do SIGKILL do
    # Docker (ARCHITECTURE.md → "Estratégia de testes").
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      HTTP_PORT: "3000"
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_WAGER_QUEUE_NAME: ${SQS_WAGER_QUEUE_NAME:-wager-transactions.fifo}
      SQS_WAGER_DLQ_NAME: ${SQS_WAGER_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_WAGER_EVENTS_QUEUE_NAME: ${SQS_WAGER_EVENTS_QUEUE_NAME:-wager-events.fifo}
    # Uma porta de host por réplica (3000-3002), só em loopback.
    ports:
      - "127.0.0.1:3000-3002:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
